# GitHub Actions — build image OpenMAIC rồi đẩy lên Docker Hub
# Đặt file này vào repo tại: .github/workflows/docker-publish.yml
# Chạy thủ công: tab Actions trên GitHub → "Build and push OpenMAIC image" → Run workflow.
# Chỉ dùng khi build Docker trên máy local thất bại / quá chậm — đừng chạy song song
# với lệnh docker build đang chạy ở máy nhà, vì cả hai build lại từ đầu.
#
# Cần tạo trước 2 secret ở repo GitHub (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME = tên tài khoản Docker Hub của bạn
#   DOCKERHUB_TOKEN    = Personal Access Token ở Docker Hub (Account Settings →
#                        Personal Access Tokens → Generate, quyền Read, Write, Delete).
#                        Dùng token, không dùng mật khẩu tài khoản.
# Đổi "trunglc318/openmaic" dưới đây thành "<tên Docker Hub của bạn>/openmaic"
# nếu tài khoản Docker Hub của bạn khác trunglc318.
#
# Vì sao runner này có cơ hội qua được chỗ Render chết: repo public trên
# runner ubuntu-latest được 4 vCPU / 16 GB RAM (GitHub Docs), trong khi Render
# chết OOM ở mức trên 8 GB khi sinh 69 trang tĩnh với 47 worker. Lưu ý: nếu repo
# là private thì cùng label chỉ còn 2 vCPU / 8 GB — đúng ngưỡng đã chết trên
# Render — và build sẽ trừ vào 2.000 phút Actions miễn phí mỗi tháng.

name: Build and push OpenMAIC image

on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: trunglc318/openmaic:latest
